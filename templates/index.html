<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────── */
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #21262d;
      --fg:        #e6edf3;
      --fg-muted:  #7d8590;
      --accent:    #388bfd;
      --accent-dim:#1f3a5f;

      --status-pending-bg:   #2d2100;
      --status-pending-fg:   #e3b341;
      --status-progress-bg:  #0d2d4a;
      --status-progress-fg:  #58a6ff;
      --status-resolved-bg:  #0d2e1f;
      --status-resolved-fg:  #3fb950;
      --status-cluster-fg:   #f85149;

      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 8px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar-logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--fg-muted);
      padding: 0 8px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .sidebar-logo span { color: var(--accent); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background .15s, color .15s;
      cursor: pointer;
    }
    .nav-item:hover, .nav-item.active {
      background: var(--accent-dim);
      color: var(--fg);
    }
    .nav-item svg { flex-shrink: 0; }
    .sidebar-footer {
      margin-top: auto;
      font-size: 11px;
      color: var(--fg-muted);
      padding: 0 8px;
    }

    /* Main */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .topbar {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .topbar h1 {
      font-size: 18px;
      font-weight: 600;
    }
    .topbar-meta {
      font-size: 12px;
      color: var(--fg-muted);
    }

    /* Filters */
    .filters {
      padding: 16px 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--fg-muted);
      pointer-events: none;
    }
    input[type="search"], select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 6px;
      padding: 7px 12px;
      font-family: var(--font-body);
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="search"] { padding-left: 32px; width: 100%; }
    input[type="search"]:focus, select:focus { border-color: var(--accent); }
    select { cursor: pointer; }
    select option { background: var(--surface); }

    /* Stats row */
    .stats {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat {
      flex: 1;
      background: var(--bg);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .06em; }
    .stat-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat-value.pending  { color: var(--status-pending-fg); }
    .stat-value.progress { color: var(--status-progress-fg); }
    .stat-value.resolved { color: var(--status-resolved-fg); }

    /* Table */
    .table-wrap { overflow-x: auto; flex: 1; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      padding: 10px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--fg-muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .1s;
    }
    tbody tr:hover { background: var(--surface); }
    tbody td {
      padding: 11px 16px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .mono { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
    .muted { color: var(--fg-muted); }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .03em;
      white-space: nowrap;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge-pending  { background: var(--status-pending-bg);  color: var(--status-pending-fg); }
    .badge-progress { background: var(--status-progress-bg); color: var(--status-progress-fg); }
    .badge-resolved { background: var(--status-resolved-bg); color: var(--status-resolved-fg); }

    .cluster-icon {
      color: var(--status-cluster-fg);
      font-size: 12px;
      margin-left: 4px;
    }

    /* Empty / loading */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--fg-muted);
    }
    .empty svg { margin-bottom: 12px; opacity: .4; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Refresh indicator */
    .refresh-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--status-resolved-fg);
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Responsive */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .topbar, .filters { padding: 14px 16px; }
      .stats { flex-wrap: wrap; }
      .stat { min-width: 45%; }
      thead th:nth-child(n+5), tbody td:nth-child(n+5) { display: none; }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">Voice<span>AI</span> Support</div>
    <a class="nav-item active" href="/">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <div class="sidebar-footer">Auto-refreshes every 30s</div>
  </nav>

  <!-- Main -->
  <div class="main">

    <!-- Top bar -->
    <div class="topbar">
      <div>
        <h1>Complaints</h1>
        <div class="topbar-meta"><span class="refresh-dot"></span>Live</div>
      </div>
      <div id="total-count" style="font-size:13px;color:var(--fg-muted)">Loading…</div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="search" placeholder="Search name, mobile, ticket…" />
      </div>
      <select id="filter-category">
        <option value="">All Categories</option>
        <option>Vehicle Complaint</option>
        <option>Service &amp; Repair</option>
        <option>Warranty</option>
        <option>Roadside Assistance</option>
        <option>Test Drive</option>
        <option>Sales Inquiry</option>
        <option>Billing</option>
        <option>Other</option>
      </select>
      <select id="filter-status">
        <option value="">All Statuses</option>
        <option>Pending</option>
        <option>In Progress</option>
        <option>Resolved</option>
      </select>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats">
      <div class="stat"><div class="stat-label">Pending</div><div class="stat-value pending" id="s-pending">—</div></div>
      <div class="stat"><div class="stat-label">In Progress</div><div class="stat-value progress" id="s-progress">—</div></div>
      <div class="stat"><div class="stat-label">Resolved</div><div class="stat-value resolved" id="s-resolved">—</div></div>
      <div class="stat"><div class="stat-label">Clusters</div><div class="stat-value" id="s-cluster" style="color:var(--status-cluster-fg)">—</div></div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ticket #</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>City / Area</th>
            <th>Category</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7"><div class="empty"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  const search   = document.getElementById('search');
  const catSel   = document.getElementById('filter-category');
  const statSel  = document.getElementById('filter-status');
  const tbody    = document.getElementById('table-body');

  function statusBadge(s) {
    const map = { 'Pending': 'pending', 'In Progress': 'progress', 'Resolved': 'resolved' };
    return `<span class="badge badge-${map[s] || 'pending'}">${s}</span>`;
  }

  function fmtDate(ts) {
    if (!ts) return '—';
    try {
      return new Date(ts).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    } catch { return ts; }
  }

  function updateStats(data) {
    document.getElementById('s-pending').textContent  = data.filter(r => r.status === 'Pending').length;
    document.getElementById('s-progress').textContent = data.filter(r => r.status === 'In Progress').length;
    document.getElementById('s-resolved').textContent = data.filter(r => r.status === 'Resolved').length;
    document.getElementById('s-cluster').textContent  = data.filter(r => r.cluster_alert).length;
    document.getElementById('total-count').textContent = `${data.length} ticket${data.length !== 1 ? 's' : ''}`;
  }

  function render(data) {
    updateStats(data);
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty">
        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 0 2-2h2a2 2 0 0 0 2 2"/></svg>
        <div>No complaints found</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(r => `
      <tr onclick="location.href='/complaint/${encodeURIComponent(r.complaint_number)}'">
        <td><span class="mono">${r.complaint_number}</span>${r.cluster_alert ? '<span class="cluster-icon" title="Cluster alert">⚠</span>' : ''}</td>
        <td>${r.caller_name || '—'}</td>
        <td class="muted">${r.mobile || '—'}</td>
        <td class="muted">${[r.city, r.area].filter(Boolean).join(' / ') || '—'}</td>
        <td>${r.category || '—'}</td>
        <td>${statusBadge(r.status)}</td>
        <td class="muted">${fmtDate(r.timestamp)}</td>
      </tr>`).join('');
  }

  function load() {
    const params = new URLSearchParams();
    if (search.value)      params.set('search',   search.value);
    if (catSel.value)      params.set('category', catSel.value);
    if (statSel.value)     params.set('status',   statSel.value);

    fetch('/api/complaints?' + params)
      .then(r => r.json())
      .then(render)
      .catch(() => {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty">Could not reach the API. Is the server running?</div></td></tr>`;
      });
  }

  let debounce;
  search.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(load, 300); });
  catSel.addEventListener('change', load);
  statSel.addEventListener('change', load);

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
